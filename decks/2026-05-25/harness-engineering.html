   `section` covers Marp decks; `body` covers pandoc reports + general HTML. */

/* Flowchart nodes — shape fills + strokes */
section svg#my-svg .node rect,

section svg#my-svg .node text,
section svg#my-svg .node .label,
section svg#my-svg text,
body svg#my-svg .nodeLabel,
body svg#my-svg .node text,

   Two problems to beat:
   1) `#my-svg p { color: #333 }` outranks the span's inherited color, so
      label text stays dark on dark deck bg until we recolor `<p>` directly.
   2) Mermaid paints both `div.labelBkg` and the inner `<p>` with a light
      grey background (#e8e8e8 at 0.5 / 0.8 opacity) intended for light

  color: #3a2810 !important;
  background-color: transparent !important;

}

   so the existing per-flow colors paint at their intended saturation.
   Selectors hit the path children of `<g class="links">`, the only `links`
   parent mermaid emits in the sankey layout. */
section svg#my-svg g.links path,
body svg#my-svg g.links path {
  stroke-opacity: 1 !important;
}

/* Quadrant chart — mmdc emits four `<g class="quadrant"><rect fill="…"/></g>`
   children with hand-picked light fills (#ECECFF → #FBFBFF). The deck rule
   above already paints `text` light, so light text lands on near-white rects
   and disappears. Repaint the four quadrant rects with the theme code-bg
   tone so the (already light) labels and data-point markers read. Also
   recolor the data-point circles, which mmdc renders with a broken
   `hsl(240, 100%, NaN%)` fill that resolves to default black and vanishes on
   dark deck bg. */
section svg#my-svg g.quadrants g.quadrant > rect,
body svg#my-svg g.quadrants g.quadrant > rect {
  fill: rgba(217, 119, 6, 0.14) !important;
}
section svg#my-svg g.data-points g.data-point circle,
body svg#my-svg g.data-points g.data-point circle {
  fill: #d97706 !important;
  stroke: #d97706 !important;
}

/* Gantt section row backgrounds — mmdc cycles through a hard-coded palette
   (purple-tint → white → bright-yellow → …) per section, none of which fit
   a dark deck. Flatten all to the theme code-bg slot so every section row
   uses the same subdued backdrop and the task bars/labels (already themed)
   stay readable. */
section svg#my-svg rect.section,
body svg#my-svg rect.section {
  fill: rgba(217, 119, 6, 0.14) !important;
}

<h1 id="harness-engineering">Harness Engineering</h1>
<h2 id="building-reliable-agents-around-an-unreliable-model">Building reliable agents around an unreliable model</h2>
<p>A field guide, with the <strong>ai-docs</strong> plugin as the worked example.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45">
<h2 id="a-model-is-not-an-agent">A model is not an agent</h2>
<ul>
<li>A frontier model is a brilliant <strong>engine</strong>. An engine is not a car.</li>
<li>Raw weights can't take an action, remember a rule, or refuse a dangerous one.</li>
<li>Capability is <strong>necessary, not sufficient</strong>. Reliability, safety, and UX come from the <strong>system around</strong> the model.</li>
</ul>
<p><strong>Takeaway: the interesting engineering is mostly <em>around</em> the model, not inside it.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45">
<h2 id="what-is-a-harness">What <em>is</em> a harness?</h2>
<p>Everything wrapped around the token stream that turns a model into a dependable system.</p>
<p><strong>Takeaway: &quot;the harness&quot; = context · tools · permissions · orchestration · contracts · feedback · tests.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45">

<h2 id="you-already-live-in-harnesses">You already live in harnesses</h2>
<p>The tools you use every day are harnesses around a frontier model:</p>
<ul>
<li><strong>Claude Code</strong> — Anthropic's agentic CLI around Claude: tools, context management, permissions, subagents, hooks.</li>
<li><strong>OpenAI Codex</strong> — one agent (GPT-5.5) across terminal/IDE/web: multi-step tool use, parallel agents.</li>
<li><strong>Google Antigravity</strong> — agent-first platform (IDE + CLI + SDK): an agent manager, subagent trees, verifiable artifacts.</li>
<li><strong>Cursor</strong> — AI-first editor: agent mode wrapping models with repo context, tools, and edits.</li>
</ul>
<p><strong>Takeaway: different vendors, the <em>same primitives</em> — agent loop, tools, context, permissions, subagents, verification. The convergence is the lesson: those primitives are the discipline.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45">
<h2 id="three-levels-of-harness-engineering">Three levels of harness engineering</h2>
<ul>
<li><strong>L0</strong> you mostly consume. <strong>L1</strong> a vendor builds. <strong>L2</strong> is where <em>you</em> work.</li>
</ul>
<p><strong>Takeaway: extending a harness is itself harness engineering — one level up.</strong></p>
</section>

<h2 id="extending-the-claude-code-harness">Extending the Claude Code harness</h2>
<p>A <strong>plugin</strong> bundles reusable extension points, declared by <code>.claude-plugin/plugin.json</code>, shared via marketplaces (<code>/plugin install</code>):</p>
<ul>
<li><strong>skills</strong> — invocable capabilities the model picks up by description</li>
<li><strong>subagents</strong> — isolated workers with their own context + tools</li>
<li><strong>hooks</strong> — intercept tool calls (PreToolUse / PostToolUse)</li>
<li><strong>MCP / LSP servers · monitors</strong> — external tools, code intelligence, background watchers</li>
</ul>
<p>The same primitives also run standalone in <code>.claude/</code> — a plugin is just the <strong>packaging</strong> for reuse.</p>
<p><strong>Takeaway: build a plugin and you are doing harness engineering at L2.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45">
<h2 id="ai-docs-is-an-l2-extension">ai-docs is an L2 extension</h2>
<p>Our case study: a Claude Code plugin that authors AI-friendly docs and publishes them to GitHub Pages.</p>
<ul>
<li>Surface: <strong>7 skills · 2 subagents · 4 hooks · deterministic scripts · an eval suite.</strong></li>
<li>It wields the very primitives the L1 products converged on.</li>
</ul>
<p><strong>Thesis for the rest of this talk: every reliability, safety, and UX property below is a <em>harness decision</em>, not a model capability.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45">

<h2 id="p1--offload-determinism-to-code">P1 · Offload determinism to code</h2>
<ul>
<li><strong>Symptom:</strong> the agent half-finishes a multi-file publish and leaves an orphaned file behind.</li>
<li><strong>Principle:</strong> the model decides <em>what / whether</em>; deterministic scripts decide <em>how</em>.</li>
<li><strong>Picture:</strong> a pilot sets the destination; the autopilot flies the exact bearing.</li>
</ul>

<h2 id="proof--n-files-one-commit--by-construction">Proof · N files, one commit — by construction</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># publish.sh — every pair lands in ONE commit via the Git Trees API</span>
--pair) SRCS+=(<span class="hljs-string">&quot;<span class="hljs-variable">${2%%:*}</span>&quot;</span>); DESTS+=(<span class="hljs-string">&quot;<span class="hljs-variable">${2#*:}</span>&quot;</span>); <span class="hljs-built_in">shift</span> 2 ;;
...
NEW_TREE_SHA=$(gh api <span class="hljs-string">&quot;repos/<span class="hljs-variable">$REPO</span>/git/trees&quot;</span> -X POST --input - --jq <span class="hljs-string">&#x27;.sha&#x27;</span>)
<span class="hljs-comment"># one tree -&gt; one commit -&gt; one ref PATCH -&gt; one Pages build</span>
</code></pre>
<p>The model <strong>cannot</strong> half-publish — bundling is the script's job. Skill rule, verbatim: <em>&quot;bundle every slug's every pair into ONE call (atomicity + race-free).&quot;</em></p>
<p><strong>Takeaway: make the safe outcome the <em>only</em> outcome the code can produce.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45">
<h2 id="proof--pre-render-at-build-time-not-view-time">Proof · Pre-render at build time, not view time</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># build-marp.sh</span>
<span class="hljs-keyword">if</span> grep -q <span class="hljs-string">&#x27;^```mermaid&#x27;</span> <span class="hljs-string">&quot;<span class="hljs-variable">$INPUT</span>&quot;</span>; <span class="hljs-keyword">then</span>
  <span class="hljs-string">&quot;<span class="hljs-variable">$HERE</span>/render-mermaid-inline.sh&quot;</span> --profile deck <span class="hljs-string">&quot;<span class="hljs-variable">$INPUT</span>&quot;</span> <span class="hljs-string">&quot;<span class="hljs-variable">$TMP</span>&quot;</span>
<span class="hljs-keyword">fi</span>
npx --<span class="hljs-built_in">yes</span> @marp-team/marp-cli@latest <span class="hljs-string">&quot;<span class="hljs-variable">$SOURCE</span>&quot;</span> --html -o <span class="hljs-string">&quot;<span class="hljs-variable">$OUTPUT</span>&quot;</span>
</code></pre>
<p>War story from the script header: view-time rendering <em>&quot;fought Marp's bespoke runtime — diagrams didn't render and slide-nav arrows broke.&quot;</em> Build-time SVG = zero view-time surprise, no client JS.</p>
<p><strong>Takeaway: resolve uncertainty early, in code, where you can test it.</strong></p>
</section>

<h2 id="p2--engineer-the-context-window">P2 · Engineer the context window</h2>
<ul>
<li><strong>Symptom:</strong> the agent pulls in a giant raw HTML page and loses the thread.</li>
<li><strong>Principle:</strong> decide what enters context, and when. Two levers: <strong>load on demand</strong> + <strong>isolate dirty data</strong>.</li>
<li><strong>Picture:</strong> a desk, not a warehouse — keep only what you're using on the surface.</li>
</ul>

<h2 id="proof--load-instructions-on-demand">Proof · Load instructions on demand</h2>
<ul>
<li><code>SKILL.md</code> stays thin; deep guidance lives in <code>recipes/</code>, <code>references/</code>, <code>templates/</code>.</li>
<li>The agent reads the <strong>one</strong> recipe for the doc type it's building — not all of them.</li>
<li>The mermaid skill ships 20 per-diagram references; only the relevant one is pulled in.</li>
</ul>
<p><strong>Takeaway: progressive disclosure — small always-on footprint, detail only on the path taken.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45">
<h2 id="proof--quarantine-dirty-data-in-a-subagent">Proof · Quarantine dirty data in a subagent</h2>
<ul>
<li><code>ai-docs-reader</code> fetches a page, writes markdown to <code>/tmp/&lt;slug&gt;.md</code>, returns <strong>a path + one-line summary</strong>.</li>
<li>Contract, verbatim: <strong>&quot;Never return raw HTML.&quot;</strong></li>
</ul>
<p>The huge, noisy HTML never touches the main context window — only the distilled result does.</p>
<p><strong>Takeaway: do the messy reading in a sandbox; hand back only the conclusion.</strong></p>
</section>

<h2 id="p3--decompose-into-isolated-agents">P3 · Decompose into isolated agents</h2>
<ul>
<li><strong>Symptom:</strong> one mega-prompt juggling everything, badly.</li>
<li><strong>Principle:</strong> an <strong>orchestrator</strong> (judgment + the user loop) directs <strong>subagents</strong> (one job, isolated context).</li>
<li><strong>Picture:</strong> a manager with specialist teams in separate rooms.</li>
</ul>
<p><strong>Takeaway: small, single-purpose workers beat one overloaded prompt.</strong></p>
</section>

<h2 id="the-boundary-rule">The boundary rule</h2>
<ul>
<li><code>askuser-protocol</code> (<code>user-invocable: false</code>), the hard rule: <strong>&quot;MUST NOT call <code>AskUserQuestion</code>.&quot;</strong></li>
<li>A subagent buried in a Task can't run an interactive prompt sanely — so it never tries.</li>
<li>Only the <strong>orchestrator</strong> talks to the user. The worker that needs input returns a <strong>Blocker Report</strong> instead.</li>
</ul>
<p><strong>Takeaway: one component owns the user loop — no surprise prompts from deep in a Task.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45">
<h2 id="p4--make-components-speak-in-contracts">P4 · Make components speak in contracts</h2>
<ul>
<li><strong>Symptom:</strong> the orchestrator has to <em>guess</em> whether the worker succeeded.</li>
<li><strong>Principle:</strong> every subagent returns one of four fixed shapes; the orchestrator routes on the <strong>opener</strong>.</li>
<li><strong>Picture:</strong> typed function signatures — agree on shapes so parts compose.</li>
</ul>
<p><strong>Takeaway: fixed output shapes turn fuzzy text into a routable interface.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45">

<h2 id="proof--blocker-report--asking-for-input-without-a-prompt">Proof · Blocker Report — asking for input without a prompt</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-md"><span class="hljs-section">## Missing Inputs</span>

| Parameter | Type | Expected Values | Rationale |
|-----------|------|-----------------|-----------|
| <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">name</span>&gt;</span></span>    | <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">type</span>&gt;</span></span> | <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">values</span>&gt;</span></span>      | <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">why</span> <span class="hljs-attr">needed</span>&gt;</span></span> |

<span class="hljs-strong">**Blocker**</span>: Cannot proceed without the above. Re-delegate with these values injected.
</code></pre>
<p>Inversion of control: the worker <strong>declares</strong> what it needs; the orchestrator collects it and re-dispatches.</p>
<p><strong>Takeaway: a stuck worker emits data, not a dead end.</strong></p>
</section>

<h2 id="proof--success-lines-are-routing-tokens">Proof · Success lines are routing tokens</h2>
<ul>
<li>Fixed openers, surfaced <strong>verbatim</strong>: <code>Doc saved:</code> · <code>Published:</code> · <code>Unpublished:</code> · <code>Themed:</code></li>
<li>Builder cardinal rule: a <strong>rejection MUST NOT</strong> start with <code>Doc saved:</code>.</li>
</ul>
<p>The discriminator is <strong>structural</strong> — orchestrator and eval suite tell success from a pause by the <em>first token</em>, not by sentiment.</p>
<p><strong>Takeaway: design openers a misbehaving model can't satisfy by accident.</strong></p>
</section>

<h2 id="p5--gate-the-irreversible--never-self-approve">P5 · Gate the irreversible — never self-approve</h2>
<ul>
<li><strong>Symptom:</strong> the agent &quot;helpfully&quot; deletes prod.</li>
<li><strong>Principle:</strong> outward / destructive actions require an explicit <strong>human Yes</strong>.</li>

<h2 id="p6--shape-permissions-keep-the-veto">P6 · Shape permissions, keep the veto</h2>
<ul>
<li><strong>Symptom:</strong> prompt-fatigue, so the user rubber-stamps everything (including the bad one).</li>
<li><strong>Principle:</strong> auto-allow the safe, internal, reversible ops; reserve prompts for what matters.</li>
<li><strong>Picture:</strong> a keycard that opens the rooms you need, not the whole building.</li>
</ul>
<p><strong>Takeaway: fewer, better prompts beat a wall of prompts nobody reads.</strong></p>

<h2 id="proof--auto-allow-only-inside-the-plugin-boundary">Proof · Auto-allow only inside the plugin boundary</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-keyword">case</span> <span class="hljs-string">&quot;<span class="hljs-variable">$abs_file</span>&quot;</span> <span class="hljs-keyword">in</span>
  <span class="hljs-string">&quot;<span class="hljs-variable">$abs_root</span>&quot;</span>/*)   <span class="hljs-comment"># prefix-match on $CLAUDE_PLUGIN_ROOT</span>
    <span class="hljs-built_in">printf</span> <span class="hljs-string">&#x27;{&quot;hookSpecificOutput&quot;:{...,&quot;permissionDecision&quot;:&quot;allow&quot;,...}}\n&#x27;</span> ;;
  *) <span class="hljs-built_in">exit</span> 0 ;;     <span class="hljs-comment"># NO DECISION -&gt; normal user permission flow</span>
<span class="hljs-keyword">esac</span>
</code></pre>
<p>Deliberately <strong>no symlink canonicalization</strong> — a <code>..</code> escape fails the prefix match and falls through to the user.</p>
<p><strong>Takeaway: when unsure, fail <em>open to the human</em>, never to the agent.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45">
<h2 id="proof--whitelist-parsing--reject-what-you-cant-prove-safe">Proof · Whitelist parsing — reject what you can't prove safe</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># auto-allow-plugin-scripts.sh — bail to the user on ANY shell metachar</span>
<span class="hljs-keyword">case</span> <span class="hljs-string">&quot;<span class="hljs-variable">$command_str</span>&quot;</span> <span class="hljs-keyword">in</span>
  *<span class="hljs-string">&#x27;;&#x27;</span>*|*<span class="hljs-string">&#x27;&amp;&amp;&#x27;</span>*|*<span class="hljs-string">&#x27;||&#x27;</span>*|*<span class="hljs-string">&#x27;|&#x27;</span>*|*<span class="hljs-string">&#x27;&amp;&#x27;</span>*|*<span class="hljs-string">&#x27;&gt;&#x27;</span>*|*<span class="hljs-string">&#x27;&lt;&#x27;</span>*|*<span class="hljs-string">&#x27;`&#x27;</span>*|*<span class="hljs-string">&#x27;$(&#x27;</span>*) <span class="hljs-built_in">exit</span> 0 ;;
<span class="hljs-keyword">esac</span>
</code></pre>
<p>No chaining, redirect, or command-substitution can ride along on an &quot;allowed&quot; script call.</p>
<p><strong>Takeaway: allow a narrow known-good set; everything else defers. Fail-safe by default.</strong></p>
</section>

<h2 id="p7--enforce-rules-structurally-not-just-in-prose-%E2%9F%B5-keystone">P7 · Enforce rules structurally, not just in prose  ⟵ keystone</h2>
<ul>
<li><strong>Symptom:</strong> the model reads &quot;always confirm,&quot; then confirms on its own.</li>
<li><strong>Principle:</strong> assume the model will eventually skip the gate — encode the rule where it <em>can't</em> override it.</li>
<li><strong>Picture:</strong> a guardrail on the mountain road, not a &quot;drive safe&quot; sign.</li>

<h2 id="proof--make-the-confirmation-unforgeable">Proof · Make the confirmation unforgeable</h2>
<p><strong>Destructive-script gate</strong> — before <code>publish.sh</code> / <code>delete.sh</code>, scan the transcript for a <em>real</em> <code>AskUserQuestion</code> Yes. Missing →</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;permissionDecision&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;ask&quot;</span><span class="hljs-punctuation">,</span>
 <span class="hljs-attr">&quot;permissionDecisionReason&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;Destructive script invocation without an
   in-transcript AskUserQuestion confirmation ... bypasses the skill contract.&quot;</span><span class="hljs-punctuation">}</span>
</code></pre>
<p><strong>no-subagent-redispatch</strong> — orchestrator re-fires a paused subagent with a forged &quot;yes&quot;? →</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">permissionDecision: <span class="hljs-string">&quot;deny&quot;</span>   <span class="hljs-comment"># &quot;Re-dispatching now would forge that confirmation.&quot;</span>
</code></pre>
<p><strong>Takeaway: the model can <em>write</em> &quot;the user said yes.&quot; The hook checks whether they actually did.</strong></p>
</section>

<h2 id="p8--close-the-loop--errors-become-actionable-context">P8 · Close the loop — errors become actionable context</h2>
<ul>
<li><strong>Symptom:</strong> the agent dead-ends on an opaque CLI error.</li>
<li><strong>Picture:</strong> compiler error → fix → recompile.</li>
</ul>
<p>e.g. <code>gh</code> not authenticated → injects <em>&quot;run <code>gh auth login</code>, then retry.&quot;</em></p>
<p><strong>Takeaway: turn raw failures into the next turn's instructions — the agent self-heals.</strong></p>
</section>

<h2 id="p9--make-multi-step-ops-atomic--idempotent">P9 · Make multi-step ops atomic &amp; idempotent</h2>
<ul>
<li><strong>Symptom:</strong> a retry double-applies a change or corrupts half-written state.</li>
<li><strong>Picture:</strong> a DB transaction (all-or-nothing) + a light switch (flip to ON = ON, however many times).</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># apply-theme.sh — strip prior theme on EVERY run, then inject (no duplicates)</span>
/&lt;!-- ai-docs-theme: [A-Za-z0-9_-]+ --&gt;/ { next }
/&lt;style data-ai-docs-theme=/ { in_block = 1; next }
</code></pre>
<p>Atomic: N files → 1 commit (P1). Idempotent: re-run safely; writes <code>.html</code> only, source <code>.md</code> stays pristine.</p>
<p><strong>Takeaway: safe to repeat, safe to interrupt, safe to resume.</strong></p>
</section>

<h2 id="p10--test-behavior-not-strings">P10 · Test behavior, not strings</h2>
<ul>
<li><strong>Symptom:</strong> tests break every time the wording changes.</li>
<li><strong>Principle:</strong> you can't assert <code>output == expected</code> on a non-deterministic model — assert on the <strong>trajectory</strong>.</li>
<li><strong>Picture:</strong> test the recipe steps, not a photo of the plated dish.</li>
</ul>
<p><strong>Takeaway: the harness needs its own test harness — one that checks <em>behavior</em>.</strong></p>
</section>

<h2 id="proof--three-layers-cheapest-first">Proof · Three layers, cheapest first</h2>
<ul>
<li><strong><code>integrity.bats</code></strong> — static, every CI tick: skill/agent refs resolve, script paths exist, atomic <code>--pair</code> / <code>--target</code> syntax pinned. Catches drift before runtime.</li>
<li><strong><code>bats</code></strong> — deterministic script behavior (<code>tests/skills/…</code>, <code>tests/hooks/…</code>).</li>
<li><strong>SDK evals</strong> — full agent trajectory against the real model (slow, costs tokens).</li>
</ul>
<p><strong>Takeaway: layer your tests — fast static checks first, expensive model runs last.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45">
<h2 id="the-harness-engineering-checklist">The Harness Engineering checklist</h2>
<ol>
<li><strong>Code does the dangerous work</strong> — offload determinism (M1)</li>
<li><strong>Spend the context budget</strong> — load on demand, isolate dirty data (M2)</li>
<li><strong>Split work, fix interfaces</strong> — isolated agents + contracts (M3)</li>
<li><strong>Guard the dangerous doors</strong> — gates, permissions, structural enforcement (M4)</li>
<li><strong>Close the loop, make it atomic</strong> — feedback + atomic/idempotent ops (M5)</li>
<li><strong>Test what it does</strong> — behavior over strings (M6)</li>
</ol>
<p><strong>Takeaway: six moves, one craft.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45">
<h2 id="the-throughline">The throughline</h2>
<blockquote>
<p><strong>Don't trust the model to follow the rules. Structure the system so the rules hold when it doesn't.</strong></p>
</blockquote>
<ul>
<li>Prose tells the model the rule.</li>
<li>Contracts make the rule <strong>checkable</strong>.</li>
<li>Hooks make the rule <strong>unbreakable</strong>.</li>
</ul>
<p><strong>Takeaway: layer all three. That's the job.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:default;" data-marpit-pagination-total="45">
<h2 id="models-change-harness-skills-compound">Models change. Harness skills compound.</h2>
<ul>
<li>The capability frontier moves monthly; these patterns don't expire.</li>
<li>Steal them — <code>ai-docs</code> is a reference implementation. Read the hooks and the eval suite first.</li>
<li><strong>Build the car, not just the engine.</strong></li>
</ul>
</section>
