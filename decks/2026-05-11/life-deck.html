<h2 id="what-each-stage-is-doing">What each stage is <em>doing</em></h2>
<ul>
<li><strong>Infancy</strong> — build the body, attach to caregivers</li>
<li><strong>Childhood</strong> — absorb language, world, rules</li>
<li><strong>Adolescence</strong> — separate, individuate, take risks</li>
<li><strong>Young adult</strong> — commit, build, mate, work</li>
<li><strong>Midlife</strong> — reassess, narrow, deepen</li>
<li><strong>Elder</strong> — integrate, transmit, let go</li>
</ul>
</section>

></p>
<p>A life is the ongoing negotiation between these poles. None of them &quot;win.&quot;</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" lang="en-GB" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="12">
<h2 id="so-what">So what</h2>
<ul>
<li>Life is a <strong>cycle</strong>, not a destination</li>
<li>Stages are not goals — they are <strong>vantage points</strong></li>
<li>The engine is <strong>cellular, relentless, miraculous</strong></li>
<li>Meaning is <strong>plural</strong> — you don't pick one, you weave several</li>
<li>The interesting question is not <em>what is life</em> but <em>what are you doing with this one</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" lang="en-GB" data-marpit-pagination="12" style="--paginate:true;--theme:default;" data-marpit-pagination-total="12">
<h2 id="closing">Closing</h2>
<blockquote>
<p>&quot;Tell me, what is it you plan to do<br />
with your one wild and precious life?&quot;<br />
— Mary Oliver</p>
</blockquote>
<p>Thanks.</p>
