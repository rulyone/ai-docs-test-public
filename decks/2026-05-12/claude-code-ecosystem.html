   stops use the default categorical palette (mid-saturation #4e79a7 blue,
   #f28e2c orange, etc.); at 50% opacity over a dark deck bg every flow
   collapses to ~25% intensity and visually disappears. Push opacity to full
   so the existing per-flow colors paint at their intended saturation.
   Selectors hit the path children of `<g class="links">`, the only `links`
   parent mermaid emits in the sankey layout. */
section svg#my-svg g.links path,
body svg#my-svg g.links path {
  stroke-opacity: 1 !important;
}

/* Quadrant chart — mmdc emits four `<g class="quadrant"><rect fill="…"/></g>`
   children with hand-picked light fills (#ECECFF → #FBFBFF). The deck rule
   above already paints `text` light, so light text lands on near-white rects
   and disappears. Repaint the four quadrant rects with the theme code-bg
   tone so the (already light) labels and data-point markers read. Also
   recolor the data-point circles, which mmdc renders with a broken
   `hsl(240, 100%, NaN%)` fill that resolves to default black and vanishes on
   dark deck bg. */
section svg#my-svg g.quadrants g.quadrant > rect,
body svg#my-svg g.quadrants g.quadrant > rect {
  fill: rgba(37, 99, 235, 0.08) !important;
}
section svg#my-svg g.data-points g.data-point circle,
body svg#my-svg g.data-points g.data-point circle {
  fill: #2563eb !important;
  stroke: #2563eb !important;
}

/* Gantt section row backgrounds — mmdc cycles through a hard-coded palette
   (purple-tint → white → bright-yellow → …) per section, none of which fit
   a dark deck. Flatten all to the theme code-bg slot so every section row
   uses the same subdued backdrop and the task bars/labels (already themed)
   stay readable. */
section svg#my-svg rect.section,
body svg#my-svg rect.section {
  fill: rgba(37, 99, 235, 0.08) !important;
}

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="what-claude-code-is">What Claude Code is</h2>
<ul>
<li>A coding agent built around the Claude model family (Opus, Sonnet, Haiku).</li>
<li>Runs in multiple surfaces: terminal CLI, IDE extensions (VS Code, JetBrains), Claude Desktop, and the web app.</li>
<li>Has direct access to your filesystem, shell, and editor — not a chat box pretending to code.</li>
<li>Same model, same tools, same harness behavior across all surfaces.</li>
<li>The CLI is the canonical surface; everything else is a thin shell around the same agent loop.</li>
</ul>
</section>

<h1 id="2-mcp--model-context-protocol">2. MCP — Model Context Protocol</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="what-mcp-is">What MCP is</h2>
<ul>
<li>An <strong>open protocol</strong> for giving an LLM agent access to external tools and data.</li>
<li>An MCP <strong>server</strong> advertises a set of tools (JSON-RPC over stdio or HTTP).</li>
<li>Claude Code is an MCP <strong>client</strong>: it discovers servers configured in <code>settings.json</code>, lists their tools, and lets the model call them.</li>
<li>Same shape as built-in tools (Read, Edit, Bash) — the model doesn't know the difference.</li>
<li>Common servers: GitHub, Slack, Google Drive, Postgres, custom internal APIs.</li>
</ul>
</section>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="the-task-tool">The Task tool</h2>
<ul>
<li>Claude Code can spawn <strong>subagents</strong> through the <code>Task</code> tool.</li>
<li>A subagent is a separate model invocation with:
<ul>
<li>its own system prompt and tool allowlist,</li>
<li>a fresh context window,</li>
<li>a defined exit (a final assistant message returned to the parent).</li>
</ul>
</li>
<li>Common built-in agent types:
<ul>
<li><strong>Explore</strong> — locate code, read files, return findings as text.</li>
<li><strong>Plan</strong> — produce a step-by-step plan without writing.</li>
<li><strong>general-purpose</strong> — open-ended; can write code and run commands.</li>
</ul>
</li>
<li>Custom subagent types are defined as markdown files with frontmatter (tools, model, system prompt).</li>
</ul>
</section>

<p>Parallel dispatch is the lever for cutting wall-clock time when subtasks are independent.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="why-subagents-at-all">Why subagents at all?</h2>
<ul>
<li><strong>Context isolation.</strong> A 200k-token Explore doesn't pollute the main thread's window.</li>
<li><strong>Specialization.</strong> A reviewer agent sees only the diff; a builder agent only the relevant files.</li>
<li><strong>Output compression.</strong> The subagent's transcript stays in its own context; only the final message lands in the parent.</li>
<li><strong>Composability.</strong> Subagents can themselves dispatch (bounded depth — usually 1 or 2 levels).</li>
</ul>
<p>The tradeoff: each subagent is a fresh model call with its own startup overhead. Don't dispatch for one-line tasks.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h1 id="4-agent-teams-cavecrew--multi-agent">4. Agent teams (cavecrew / multi-agent)</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="the-orchestrator-pattern">The orchestrator pattern</h2>
<ul>
<li>Main thread acts as <strong>orchestrator</strong>: decides which specialist to call and stitches results.</li>
<li>Specialists are subagent types with narrow scope:
<ul>
<li><strong>Investigator</strong> — read-only; locates code, surfaces facts.</li>
<li><strong>Builder</strong> — edits 1–2 files within a known scope.</li>
<li><strong>Reviewer</strong> — sees a diff, returns a verdict.</li>
</ul>
</li>
<li>Each specialist's output is a short, structured artifact the orchestrator can re-inject as input to the next.</li>
<li>This is the same pattern Claude Code's <code>ai-docs</code> plugin uses (orchestrator + <code>ai-docs-builder</code> subagent).</li>
</ul>
</section>

<h1 id="5-hooks">5. Hooks</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="what-hooks-are">What hooks are</h2>
<ul>
<li><strong>Shell commands</strong> the harness runs at fixed lifecycle points around the agent loop.</li>
<li>Configured in <code>settings.json</code> — declarative, not in-prompt.</li>
<li>The harness (not the model) executes hooks, so they fire deterministically.</li>
<li>They can <strong>inject context</strong> (stdout becomes a system message) or <strong>block</strong> an action (non-zero exit on PreToolUse).</li>
</ul>
<table>
<thead>
<tr>
<th>Hook</th>
<th>Fires</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>SessionStart</code></td>
<td>New session begins</td>
</tr>
<tr>
<td><code>UserPromptSubmit</code></td>
<td>Before each user turn</td>
</tr>
<tr>
<td><code>PreToolUse</code></td>
<td>Before a tool call (can deny)</td>
</tr>
<tr>
<td><code>PostToolUse</code></td>
<td>After a tool call returns</td>
</tr>
<tr>
<td><code>Stop</code></td>
<td>Agent finishes responding</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">

<h1 id="6-skills">6. Skills</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="what-skills-are">What skills are</h2>
<ul>
<li>Self-contained <strong>capability bundles</strong> stored as markdown + optional scripts.</li>
<li>Each skill has a <code>name</code>, a <code>description</code>, and a body of instructions.</li>
<li>The harness exposes skill metadata to the model. When a user request matches a skill's triggers, the model calls the <strong><code>Skill</code> tool</strong> to load it.</li>
<li>Once loaded, the skill's full body enters context as instructions the model follows.</li>
<li>Skills can ship <strong>scripts</strong> (bash, python) the model invokes via Bash.</li>
<li>Plugins (like <code>ai-docs</code>, <code>caveman</code>, <code>example-skills</code>) bundle multiple skills under a namespace.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">

<h1 id="7-rag--retrieval-augmented-generation">7. RAG — retrieval-augmented generation</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="rag-in-a-claude-code-context">RAG in a Claude Code context</h2>
<ul>
<li>Most useful when the project is too large to fit in context (codebase, docs corpus, long-running logs).</li>
<li>Two-phase pipeline:
<ol>
<li><strong>Indexing</strong> (offline): chunk documents → embed each chunk → store vectors + metadata.</li>
<li><strong>Query time</strong> (per request): embed the query → similarity-search the store → inject top-k chunks into the prompt.</li>
</ol>
</li>
<li>The retrieval store is typically exposed to Claude Code through an <strong>MCP server</strong> (vector DB, doc search, repo grep).</li>
<li>RAG is complementary to subagent-based exploration: subagents can navigate code structurally; RAG returns semantically similar passages.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">

<h1 id="8-memory-system">8. Memory system</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:default;" data-marpit-pagination-total="33">
<h2 id="file-based-not-vector-based">File-based, not vector-based</h2>
<ul>
<li>Claude Code's memory is <strong>plain markdown files</strong> the harness loads at session start (or on demand).</li>
<li>Common kinds:
<ul>
<li><strong>User memory</strong> (<code>~/.claude/CLAUDE.md</code>) — global preferences, never project-scoped.</li>
<li><strong>Project memory</strong> (<code>./CLAUDE.md</code>) — facts about this repo.</li>
<li><strong>Feedback memory</strong> — accumulated corrections from past sessions.</li>
<li><strong>Reference memory</strong> — long-lived notes (<code>~/.claude/memory/refs/...</code>).</li>
</ul>
</li>
<li>Memory is <strong>human-readable</strong> — you can <code>cat</code> it, edit it, version it.</li>
<li>The harness's <code>SessionStart</code> hook is usually where memory gets injected.</li>
</ul>
</section>

<h2 id="takeaways">Takeaways</h2>
<ul>
<li><strong>One model, many surfaces.</strong> CLI is canonical; everything else wraps it.</li>
<li><strong>MCP is the extension boundary.</strong> Anything external — repos, dashboards, vector stores — looks like a tool.</li>
<li><strong>Subagents are for isolation, not cleverness.</strong> Use them to keep contexts clean and parallelize.</li>
<li><strong>Hooks are deterministic.</strong> They run in the harness, not the model. Trust them for safety and logging.</li>
<li><strong>Skills are lazy capabilities.</strong> Metadata is always on; bodies load on match.</li>
<li><strong>Memory is a file.</strong> Read it, edit it, commit it.</li>
<li><strong>RAG fills the long-tail.</strong> When the corpus is bigger than the window, retrieve and inject.</li>
</ul>
<p>Compose these and you get an agent that scales without becoming a black box.</p>
