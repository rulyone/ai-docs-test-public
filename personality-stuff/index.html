<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instinct Stack Test</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#1f232c; --line:#2a2f3a;
    --txt:#e7e9ee; --muted:#9aa3b2; --accent:#7c9cff; --accent2:#ffb86b;
    --most:#4ade80; --least:#f87171; --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:32px 16px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;position:relative}
  .langbar{display:flex;justify-content:flex-end;margin:0 0 6px}
  .langbar button{
    background:var(--card2);border:1px solid var(--line);color:var(--muted);
    border-radius:9px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;
  }
  .langbar button:hover{border-color:var(--muted);color:var(--txt)}
  h1{font-size:26px;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 20px}
  .note{
    background:var(--card2);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;color:var(--muted);font-size:14px;margin:0 0 24px;
  }
  .note b{color:var(--txt)}
  .q{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 14px;margin:0 0 16px;position:relative;transition:border-color .2s;
  }
  .q.done{border-color:#39507e}
  .q .qhead{display:flex;gap:10px;align-items:baseline;margin:0 0 14px}
  .q .num{color:var(--accent);font-weight:700;font-size:14px;min-width:24px}
  .q .qtext{font-weight:600}
  .opt{
    display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);
  }
  .opt .label{flex:1;font-size:15px}
  .picks{display:flex;gap:8px;flex-shrink:0}
  .pick{
    border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;
    transition:all .15s;white-space:nowrap;
  }
  .pick:hover{border-color:var(--muted)}
  .pick.most.on{background:var(--most);border-color:var(--most);color:#06240f}
  .pick.least.on{background:var(--least);border-color:var(--least);color:#350c0c}
  .colhint{display:flex;justify-content:flex-end;gap:8px;margin-bottom:2px}
  .colhint span{font-size:11px;color:var(--muted);width:70px;text-align:center}
  .section-title{font-size:18px;margin:32px 0 6px}
  .section-desc{color:var(--muted);font-size:14px;margin:0 0 16px}
  .slider{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin:0 0 14px;
  }
  .slider h3{margin:0 0 12px;font-size:15px}
  .row{margin:0 0 14px}
  .row:last-child{margin-bottom:0}
  .row .rlabel{font-size:13.5px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:12px}
  .row .val{color:var(--accent);font-weight:700}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .bar{
    position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);
    padding:18px 0 4px;margin-top:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .progress{color:var(--muted);font-size:14px}
  .progress b{color:var(--txt)}
  button.go{
    background:var(--accent);color:#0a1330;border:none;border-radius:11px;
    padding:13px 24px;font-size:15px;font-weight:700;cursor:pointer;
  }
  button.go:disabled{opacity:.4;cursor:not-allowed}
  .err{color:var(--least);font-size:14px}
  #result{display:none;margin-top:8px}
  .stackline{font-size:40px;font-weight:800;letter-spacing:1px;margin:8px 0 2px}
  .stackfull{color:var(--muted);margin:0 0 24px}
  .rcard{
    background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:var(--radius);padding:16px 18px;margin:0 0 14px;
  }
  .rcard .role{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);font-weight:700}
  .rcard.sec{border-left-color:var(--most)}
  .rcard.sec .role{color:var(--most)}
  .rcard.ter{border-left-color:var(--muted)}
  .rcard.ter .role{color:var(--muted)}
  .rcard h3{margin:4px 0 8px;font-size:19px}
  .rcard p{margin:0;color:#cdd2dc;font-size:15px}
  .flag{
    background:var(--card2);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin:14px 0 0;font-size:14.5px;
  }
  .flag .ft{font-weight:700;color:var(--accent2);display:block;margin-bottom:3px}
  .scores{display:flex;gap:10px;margin:18px 0 0;flex-wrap:wrap}
  .scores .s{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
  .scores .s b{color:var(--txt)}
  .retake{margin-top:24px;background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:11px;padding:11px 20px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">

  <div class="langbar"><button id="langtoggle"></button></div>

  <div id="form">
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div class="note" id="note"></div>

    <div id="questions"></div>

    <h2 class="section-title" id="sectionTitle"></h2>
    <p class="section-desc" id="sectionDesc"></p>
    <div id="sliders"></div>

    <div class="bar">
      <button class="go" id="submit"></button>
      <span class="progress"><b id="answered">0</b> <span id="answeredWord"></span></span>
      <span class="err" id="err"></span>
    </div>
  </div>

  <div id="result"></div>

</div>

<script>
/* =========================================================================

   Instinct keys (sp/sx/so) live only here; never rendered to the page.

  es:{
    names:{sp:"Conservación", sx:"Sexual / Uno a uno", so:"Social"},

/* ---- STATE ---- */
let LANG = (navigator.language||"en").toLowerCase().startsWith("es") ? "es" : "en";
const QN = PACK.en.questions.length;

// one shuffle permutation, reused for both languages (option keys align by index)
const perm = PACK.en.questions.map(q=>{
  const idx=q.o.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  return idx;
});
const optsFor = qi => perm[qi].map(i=>PACK[LANG].questions[qi].o[i]);

const answers = Array.from({length:QN},()=>({most:null,least:null}));
const layer = {sp:{charge:5,ease:5}, sx:{charge:5,ease:5}, so:{charge:5,ease:5}};
let lastResult = null;

/* ---- ELEMENTS ---- */
const $ = id => document.getElementById(id);
const qWrap = $("questions"), sWrap = $("sliders");

/* ---- RENDERERS ---- */
function renderQuestions(){
  const ui = PACK[LANG].ui;
  qWrap.innerHTML = "";
  for(let qi=0; qi<QN; qi++){
    const opts = optsFor(qi);
    const card=document.createElement("div");
    card.className="q"; card.id="q"+qi;
    let html='<div class="qhead"><span class="num">'+(qi+1)+'</span><span class="qtext">'+PACK[LANG].questions[qi].q+'</span></div>';
    html+='<div class="colhint"><span>'+ui.colMost+'</span><span>'+ui.colLeast+'</span></div>';
    opts.forEach((opt,oi)=>{
      html+='<div class="opt"><span class="label">'+opt.t+'</span><span class="picks">'
        +'<button class="pick most" data-qi="'+qi+'" data-oi="'+oi+'" data-kind="most">'+ui.pickMost+'</button>'
        +'<button class="pick least" data-qi="'+qi+'" data-oi="'+oi+'" data-kind="least">'+ui.pickLeast+'</button>'
        +'</span></div>';
    });
    card.innerHTML=html;
    qWrap.appendChild(card);
    paintQuestion(qi);
  }
}

function paintQuestion(qi){
  const a=answers[qi], card=$("q"+qi), opts=optsFor(qi);
  card.querySelectorAll(".pick").forEach(b=>{
    const k=opts[+b.dataset.oi].k, kind=b.dataset.kind;
    b.classList.toggle("on",(kind==="most"&&a.most===k)||(kind==="least"&&a.least===k));
  });
  card.classList.toggle("done", a.most!==null && a.least!==null);
}

function renderSliders(){
  sWrap.innerHTML="";
  PACK[LANG].domains.forEach(d=>{
    const box=document.createElement("div"); box.className="slider";
    box.innerHTML="<h3>"+d.h+"</h3>"+sliderRow(d.k,"charge",d.charge)+sliderRow(d.k,"ease",d.ease);
    sWrap.appendChild(box);
  });
}
function sliderRow(k,which,label){
  const v=layer[k][which];
  return '<div class="row"><div class="rlabel"><span>'+label+'</span>'
    +'<span class="val" id="v_'+k+'_'+which+'">'+v+'</span></div>'
    +'<input type="range" min="0" max="10" value="'+v+'" data-k="'+k+'" data-w="'+which+'"></div>';
}

function applyLang(){
  const ui = PACK[LANG].ui;
  document.documentElement.lang = LANG;
  $("langtoggle").textContent = ui.toggleTo;
  $("title").textContent = ui.title;
  $("sub").textContent = ui.sub;
  $("note").innerHTML = ui.note;
  $("sectionTitle").textContent = ui.sectionTitle;
  $("sectionDesc").textContent = ui.sectionDesc;
  $("submit").textContent = ui.submit;
  $("answeredWord").textContent = ui.progressSuffix;
  renderQuestions();
  renderSliders();
  updateProgress();
  if(lastResult) renderResult(lastResult);
}

/* ---- EVENTS (delegated, bound once) ---- */
qWrap.addEventListener("click",e=>{
  const b=e.target.closest(".pick"); if(!b) return;
  const qi=+b.dataset.qi, oi=+b.dataset.oi, kind=b.dataset.kind;
  const k=optsFor(qi)[oi].k, a=answers[qi];
  if(kind==="most"){ a.most=a.most===k?null:k; if(a.least===k) a.least=null; }
  else            { a.least=a.least===k?null:k; if(a.most===k) a.most=null; }
  paintQuestion(qi); updateProgress();
});

sWrap.addEventListener("input",e=>{
  if(e.target.type!=="range") return;
  const k=e.target.dataset.k, w=e.target.dataset.w;
  layer[k][w]=+e.target.value;
  $("v_"+k+"_"+w).textContent=e.target.value;
});

$("langtoggle").addEventListener("click",()=>{ LANG = LANG==="en"?"es":"en"; applyLang(); });

$("submit").addEventListener("click",()=>{
  const ui=PACK[LANG].ui;
  const firstMissing=answers.findIndex(a=>a.most===null||a.least===null);
  if(firstMissing>=0){
    $("err").textContent=ui.err(firstMissing+1);
    $("q"+firstMissing).scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  lastResult=score();
  renderResult(lastResult);
});

/* ---- PROGRESS ---- */
function updateProgress(){
  const done=answers.filter(a=>a.most!==null&&a.least!==null).length;
  $("answered").textContent=done;
  $("submit").disabled = done<QN;
  if(done===QN) $("err").textContent="";
}

/* ---- SCORE ---- */
function score(){
  const t={sp:0,sx:0,so:0};
  answers.forEach(a=>{ t[a.most]++; t[a.least]--; });
  const order=["sp","sx","so"].sort((a,b)=>(t[b]-t[a])||(layer[b].charge-layer[a].charge));
  return {t,order};
}

function renderResult({t,order}){
  const ui=PACK[LANG].ui, NAMES=PACK[LANG].names, BLURB=PACK[LANG].blurb, ABBR={sp:"sp",sx:"sx",so:"so"};
  const [dom,sec,ter]=order;
  const maxCharge=Math.max(layer.sp.charge,layer.sx.charge,layer.so.charge);
  const maxEase=Math.max(layer.sp.ease,layer.sx.ease,layer.so.ease);

  let flags="";
  if(layer[dom].charge===maxCharge && layer[dom].charge>=7)
    flags+=flag(ui.flagFixTitle, ui.flagFix(NAMES[dom]));
  if(layer[sec].ease===maxEase)
    flags+=flag(ui.flagComfortTitle, ui.flagComfort(NAMES[sec]));
  if(layer[ter].charge>=7)
    flags+=flag(ui.flagDivTitle, ui.flagDiv(NAMES[ter]));
  if(t[dom]-t[sec]<=1)
    flags+=flag(ui.flagBlendTitle, ui.flagBlend(NAMES[dom],NAMES[sec]));

  $("result").innerHTML=
    "<h1>"+ui.resultTitle+"</h1>"
    +'<div class="stackline">'+ABBR[dom]+"/"+ABBR[sec]+"/"+ABBR[ter]+"</div>"
    +'<p class="stackfull">'+NAMES[dom]+" &nbsp;›&nbsp; "+NAMES[sec]+" &nbsp;›&nbsp; "+NAMES[ter]+"</p>"
    +rcard("dominant",ui.roleDom,dom,"",NAMES,BLURB)
    +rcard("secondary",ui.roleSec,sec,"sec",NAMES,BLURB)
    +rcard("tertiary",ui.roleTer,ter,"ter",NAMES,BLURB)
    +flags
    +'<div class="scores"><span class="s">'+ui.scoresLabel+" "
      +"<b>"+NAMES.sp+"</b> "+sign(t.sp)+" &nbsp; "
      +"<b>"+NAMES.sx+"</b> "+sign(t.sx)+" &nbsp; "
      +"<b>"+NAMES.so+"</b> "+sign(t.so)+"</span></div>"
    +'<div class="flag"><span class="ft">'+ui.rememberTitle+"</span>"+ui.rememberBody+"</div>"
    +'<button class="retake" id="retake">'+ui.retake+"</button>";

  $("retake").addEventListener("click",()=>location.reload());
  $("form").style.display="none";
  $("result").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}

function rcard(role,roleLabel,k,cls,NAMES,BLURB){
  return '<div class="rcard '+cls+'"><span class="role">'+roleLabel+"</span>"
    +"<h3>"+NAMES[k]+"</h3><p>"+BLURB[role][k]+"</p></div>";
}
function flag(title,body){ return '<div class="flag"><span class="ft">'+title+"</span>"+body+"</div>"; }
function sign(n){ return (n>0?"+":"")+n; }

/* ---- INIT ---- */
applyLang();
</script>
</body>
</html>
